name: Push
run-name: Push ${{ inputs.package }}

on:
  push:
    branches:
      - main
    paths-ignore:
      - README.md
      - LICENSE
      - Makefile
      - ".github/**"
      - ".vscode/**"
  workflow_dispatch:
    inputs:
      package:
        description: "Package"
        required: true
        default: all
        type: choice
        options:
          - csi-oci
          #
          - fluentd
          - ipsec
          - keydb
          - mongodb
          - mongosqld
          - mongosync
          - nginx-openresty
          - openvpn
          - pgbouncer
          - postgresql
          - iptables
          - reviewdog
          - skopeo
          - supercronic
          - tabix
          - tailscale
          - tinyproxy
          - vals
          - wal-g
          - ytt
          # cicd
          - teamcity
          - github-actions-runner
          #
          - all

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  packages:
    name: List packages
    runs-on: ubuntu-24.04
    outputs:
      packages: ${{ steps.package.outputs.packages || steps.filter.outputs.changes }}
    permissions:
      pull-requests: read
    steps:
      - name: Checkout
        if: ${{ inputs.package == 'all' || github.event_name != 'pull_request' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 5

      - name: Check changes
        if: ${{ inputs.package == 'all' || inputs.package == '' }}
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # make list | xargs -n1 | xargs -L 1 -I {} -R 2 echo "{}: [{}/**]" > .github/packages.yaml
          filters: .github/packages.yaml
          base: ${{ github.event_name != 'pull_request' && github.ref || '' }}
      - name: Set packages
        if: ${{ inputs.package != 'all' && inputs.package != '' }}
        id: package
        run: echo "packages=[\"${{ inputs.package }}\"]" >> "$GITHUB_OUTPUT"

  build-push:
    name: Release image
    timeout-minutes: 240
    needs: packages
    runs-on: Builder
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        pkg: ${{ fromJSON(needs.packages.outputs.packages) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Set up QEMU
        timeout-minutes: 2
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64
      - name: Set up docker buildx
        timeout-minutes: 2
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Github registry login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Expose GitHub Runtime
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      - name: Build image
        timeout-minutes: 240
        run: make package-${{ matrix.pkg }}
        env:
          PUSH: "true"
      - name: Sign image
        timeout-minutes: 5
        run: make cosign-${{ matrix.pkg }}

      # - name: Clean old images
      #   uses: actions/delete-package-versions@v5
